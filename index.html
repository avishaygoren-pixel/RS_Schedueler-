<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Job Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#1c1a17; --panel:#25221e; --panel2:#2d2a25; --line:#3a362f;
    --accent:#c9873f; --accent2:#e0a862; --text:#f0ebe3; --sub:#a89f91;
    --ok:#6b9e6b; --danger:#b5573f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:22px;letter-spacing:.5px}
  header .tag{color:var(--sub);font-size:13px;margin-top:4px}
  .tabs{display:flex;gap:6px;padding:14px 28px 0}
  .tab{padding:10px 18px;border-radius:8px 8px 0 0;background:var(--panel);color:var(--sub);cursor:pointer;border:1px solid var(--line);border-bottom:none;font-size:14px}
  .tab.active{background:var(--panel2);color:var(--accent2);font-weight:600}
  main{padding:24px 28px;max-width:1300px;margin:0 auto}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
  .card h2{margin:0 0 14px;font-size:16px;color:var(--accent2)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:7px;font-size:14px;font-family:inherit}
  input[type=date]{color-scheme:dark}
  button{background:var(--accent);color:#1c1a17;border:none;padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer;font-size:14px}
  button.secondary{background:transparent;color:var(--accent2);border:1px solid var(--accent);}
  button.danger{background:var(--danger);color:#fff;padding:4px 10px;font-size:12px}
  ul.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
  ul.list li{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:10px 14px;border-radius:7px;border:1px solid var(--line)}
  .empty-state{color:var(--sub);font-size:14px;padding:10px 0}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}

  .plan-table{display:flex;flex-direction:column;gap:12px}
  .plan-row{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px;display:grid;grid-template-columns:44px 1.3fr 2fr 1.7fr;gap:14px;align-items:start}
  .plan-row .num{background:var(--accent);color:#1c1a17;font-weight:700;border-radius:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
  .plan-row .addr{font-weight:600;padding-top:6px}
  .plan-col label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
  .plan-col label .ico{margin-right:4px}
  .plan-row textarea{width:100%;min-height:60px;resize:vertical}
  .plan-row select{width:100%}

  .msel{position:relative}
  .msel-btn{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px}
  .msel-panel{display:none;position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .msel-panel.open{display:block}
  .msel-panel::-webkit-scrollbar{width:10px}
  .msel-panel::-webkit-scrollbar-track{background:var(--panel)}
  .msel-panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .msel-panel::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  .msel-panel{scrollbar-width:thin;scrollbar-color:var(--line) var(--panel)}
  .msel-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .msel-item:hover{background:var(--panel)}
  .msel-item.disabled{opacity:.4;cursor:not-allowed}
  .msel-item .check{width:16px;height:16px;border:1px solid var(--sub);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
  .msel-item.selected .check{background:var(--accent);border-color:var(--accent);color:#1c1a17}
  .msel-item .busytag{margin-left:auto;font-size:10px;color:var(--danger)}

  .task-add-row{display:flex;gap:6px}
  .task-add-row input{flex:1}

  @media (max-width:700px){
    header{padding:14px 16px}
    header h1{font-size:18px}
    header .tag{font-size:11px}
    .tabs{padding:10px 16px 0;gap:4px}
    .tab{padding:9px 12px;font-size:13px}
    main{padding:14px}
    .card{padding:14px}
    .card h2{font-size:14px}

    .row{gap:8px}
    input,select,textarea,button{font-size:16px} /* prevents iOS auto-zoom on focus */
    button{padding:11px 14px;width:100%}
    .toolbar .row{width:100%}
    .toolbar .row input[type=date]{flex:1;min-width:0}
    .toolbar button.secondary{width:auto;flex:1}
    .toolbar > button{width:100%}

    .plan-row{
      grid-template-columns:36px 1fr;
      gap:8px 10px;
      padding:12px;
    }
    .plan-row .num{width:26px;height:26px;font-size:13px}
    .plan-row .addr{font-size:14px;padding-top:2px}
    .plan-col{grid-column:1/-1}
    .plan-col label{font-size:12px;margin-bottom:5px}
    .msel-btn{padding:11px 12px;font-size:14px}
    .msel-item{padding:11px 10px;font-size:14px}
    .msel-panel{max-height:50vh;overflow-y:auto}

    ul.list li{padding:12px 14px;font-size:14px}
    button.danger{padding:7px 12px;font-size:12px;width:auto}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Job Scheduler</h1>
    <div class="tag">Contractor Dashboard</div>
  </div>
</header>

<div class="tabs no-print">
  <div class="tab" data-tab="dashboard">Dashboard</div>
  <div class="tab active" data-tab="schedule">Daily Schedule</div>
</div>

<main>

<div id="view-dashboard" style="display:none">
  <div class="card">
    <h2>Jobs (Addresses)</h2>
    <div class="row">
      <input id="jobName" placeholder="Job name / address">
      <button onclick="addJob()">Add Job</button>
    </div>
    <ul class="list" id="jobsList"></ul>
  </div>

  <div class="card">
    <h2>Workers</h2>
    <div class="row">
      <input id="workerName" placeholder="Worker name">
      <button onclick="addWorker()">Add Worker</button>
    </div>
    <ul class="list" id="workersList"></ul>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <div class="row">
      <input id="taskName" placeholder="New task name">
      <button onclick="addTask()">Add Task</button>
    </div>
    <ul class="list" id="tasksList"></ul>
  </div>
</div>

<div id="view-schedule">
  <div class="card">
    <div class="toolbar">
      <div class="row" style="margin:0">
        <input type="date" id="planDate">
        <button class="secondary" onclick="shiftDay(-1)">‹ Previous Day</button>
        <button class="secondary" onclick="shiftDay(1)">Next Day ›</button>
      </div>
      <button onclick="generatePDF()">Download PDF</button>
    </div>
    <div class="plan-table" id="planTable"></div>
  </div>
</div>

<div id="pdfBanner" style="position:absolute;left:-9999px;top:0;width:1600px;background:#100e0c;">
  <div style="height:16px;background:repeating-linear-gradient(135deg,#f5b52a 0 40px,#100e0c 40px 80px);"></div>
  <div style="text-align:center;padding:36px 20px 24px;font-family:'Anton',Impact,sans-serif;">
    <div style="font-size:118px;line-height:1;color:#fff;letter-spacing:2px;">RS WORK</div>
    <div style="font-size:118px;line-height:1;color:#f5b52a;letter-spacing:2px;margin-top:-6px;">SCHEDULE</div>
    <div style="font-family:Arial,sans-serif;font-weight:700;letter-spacing:5px;color:#fff;font-size:24px;margin-top:26px;">TEAMWORK &bull; DEDICATION &bull; GETTING IT DONE</div>
    <div id="pdfBannerDate" style="font-family:Arial,sans-serif;color:#f5b52a;font-weight:700;font-size:28px;margin-top:16px;"></div>
  </div>
  <div style="height:16px;background:repeating-linear-gradient(135deg,#f5b52a 0 40px,#100e0c 40px 80px);"></div>
</div>



</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ===== STEP 1: Paste your Firebase project config here (see setup instructions) =====
const firebaseConfig = {
  apiKey: "AIzaSyAJVAw5WRM8xVucxKTPYupO2VAGNZ4ssGE",
  authDomain: "rs-carpentry.firebaseapp.com",
  projectId: "rs-carpentry",
  storageBucket: "rs-carpentry.firebasestorage.app",
  messagingSenderId: "352992734924",
  appId: "1:352992734924:web:de486b184026120f27dc69"
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db=null, docRef=null;
if(FIREBASE_CONFIGURED){
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  docRef=db.collection('scheduler').doc('data');

</script>
<script>
let jobs=[], workers=[], tasks=[], plans={}; // plans[date][jobId] = {workerIds:[], task:'', notes:''}
const DEFAULT_TASKS=['Paint','Drywall','Stucco','Electrical','Mechanical','Plumbing','Plaster','Tile','Cabinets','Hot mop','Flooring','Roofing','Window','Lathing','Continue','Insulation','Footing','Cabinet'];

let planDate = fmt(new Date());
let pendingRemoteData = null;
function flushPendingRemote(){
  if(pendingRemoteData){ applyData(pendingRemoteData); pendingRemoteData=null; }
}

function startOfWeek(d){
  const dt=new Date(d); dt.setDate(dt.getDate()-dt.getDay()); dt.setHours(0,0,0,0); return dt;
}
function fmt(d){ return d.toISOString().slice(0,10); }
function heDate(d){ return d.toLocaleDateString('en-US',{day:'2-digit',month:'2-digit'}); }
const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function applyData(d){
  jobs = d.jobs || [];
  workers = d.workers || [];
  tasks = (d.tasks && d.tasks.length) ? d.tasks : [...DEFAULT_TASKS];
  plans = d.plans || {};
}
function readLocal(){
  let d={};
  try{d.jobs=JSON.parse(localStorage.getItem('js_jobs'))||[];}catch(e){d.jobs=[];}
  try{d.workers=JSON.parse(localStorage.getItem('js_workers'))||[];}catch(e){d.workers=[];}
  try{d.tasks=JSON.parse(localStorage.getItem('js_tasks'))||[];}catch(e){d.tasks=[];}
  try{d.plans=JSON.parse(localStorage.getItem('js_plans'))||{};}catch(e){d.plans={};}
  return d;
}
function writeLocal(){
  localStorage.setItem('js_jobs', JSON.stringify(jobs));
  localStorage.setItem('js_workers', JSON.stringify(workers));
  localStorage.setItem('js_tasks', JSON.stringify(tasks));
  localStorage.setItem('js_plans', JSON.stringify(plans));
}

function load(){
  document.getElementById('planDate').value=planDate;
  document.getElementById('planDate').addEventListener('change',e=>{ planDate=e.target.value; renderPlan(); });

  if(FIREBASE_CONFIGURED){
    docRef.get().then(snap=>{
      applyData(snap.exists ? snap.data() : {});
      render();
    });
    // live sync: auto-refresh when the other device saves a change
    docRef.onSnapshot(snap=>{
      if(!snap.exists) return;
      if(document.querySelector('.msel-panel.open')){
        pendingRemoteData = snap.data(); // defer until the open dropdown is closed
      } else {
        applyData(snap.data());
        render();
      }
    });
  } else {
    applyData(readLocal());
    render();
  }
}
function save(){
  if(FIREBASE_CONFIGURED){
    docRef.set({jobs,workers,tasks,plans});
  } else {
    writeLocal();
  }
}

function addJob(){
  const v=document.getElementById('jobName').value.trim();
  if(!v)return;
  jobs.push({id:Date.now(),name:v});
  document.getElementById('jobName').value='';
  save();render();
}
function removeJob(id){
  jobs=jobs.filter(j=>j.id!==id);
  Object.values(plans).forEach(dayPlan=>{ delete dayPlan[id]; });
  save();render();
}
function addWorker(){
  const v=document.getElementById('workerName').value.trim();
  if(!v)return;
  workers.push({id:Date.now(),name:v});
  document.getElementById('workerName').value='';
  save();render();
}
function removeWorker(id){
  workers=workers.filter(w=>w.id!==id);
  Object.values(plans).forEach(dayPlan=>{
    Object.values(dayPlan).forEach(p=>{ p.workerIds=p.workerIds.filter(w=>w!==id); });
  });
  save();render();
}
function addTask(){
  const v=document.getElementById('taskName').value.trim();
  if(!v || tasks.includes(v))return;
  tasks.push(v);
  document.getElementById('taskName').value='';
  save();render();
}
function removeTask(name){
  tasks=tasks.filter(t=>t!==name);
  save();render();
}

function shiftDay(n){
  const d=new Date(planDate);
  d.setDate(d.getDate()+n);
  planDate=fmt(d);
  document.getElementById('planDate').value=planDate;
  renderPlan();
}

function getCell(date,jobId){
  if(!plans[date]) plans[date]={};
  if(!plans[date][jobId]) plans[date][jobId]={workerIds:[],tasks:[]};
  if(!plans[date][jobId].tasks) plans[date][jobId].tasks=[]; // migrate old single-task cells
  return plans[date][jobId];
}

function render(){
  const jl=document.getElementById('jobsList');
  jl.innerHTML = jobs.length? jobs.map(j=>`<li><span>${j.name}</span><button class="danger no-print" onclick="removeJob(${j.id})">Delete</button></li>`).join('') : '<div class="empty-state">No jobs yet</div>';

  const wl=document.getElementById('workersList');
  wl.innerHTML = workers.length? workers.map(w=>`<li><span>${w.name}</span><button class="danger no-print" onclick="removeWorker(${w.id})">Delete</button></li>`).join('') : '<div class="empty-state">No workers yet</div>';

  const tl=document.getElementById('tasksList');
  tl.innerHTML = tasks.length? tasks.map(t=>`<li><span>${t}</span><button class="danger no-print" onclick="removeTask('${t.replace(/'/g,"\\'")}')">Delete</button></li>`).join('') : '<div class="empty-state">No tasks yet</div>';

  renderPlan();
}

const BADGE_COLORS=['#2f6fd6','#3a9b5c','#e0812f','#8b5fbf','#1f9b8e','#e0b32f','#d64545'];

function renderPlan(){
  const table=document.getElementById('planTable');
  if(!jobs.length){ table.innerHTML='<div class="empty-state">Add jobs in the Dashboard first</div>'; return; }

  table.innerHTML = jobs.map((j,idx)=>{
    const cell=getCell(planDate,j.id);
    const selectedNames = cell.workerIds.map(id=>{const w=workers.find(x=>x.id===id); return w?w.name:null;}).filter(Boolean);
    const btnLabel = selectedNames.length? selectedNames.join(', ') : 'Select workers';
    const badgeColor = BADGE_COLORS[idx % BADGE_COLORS.length];

    let taskColHtml = `<div class="msel" id="tsel-${j.id}">
        <button type="button" class="msel-btn no-print" onclick="event.stopPropagation();toggleTsel(${j.id})">${cell.tasks.length? cell.tasks.join(', ') : 'Select task'}</button>
        <div class="msel-panel" id="tselpanel-${j.id}"></div>
      </div>`;

    return `<div class="plan-row" style="border-left-color:${badgeColor}">
      <div class="num" style="background:${badgeColor}">${idx+1}</div>
      <div class="addr">📍 ${j.name}</div>

      <div class="plan-col">
        <label><span class="ico">👷</span>Workers</label>
        <div class="msel" id="msel-${j.id}">
          <button type="button" class="msel-btn no-print" onclick="event.stopPropagation();toggleMsel(${j.id})">${btnLabel}</button>
          <div class="msel-panel" id="mselpanel-${j.id}"></div>
        </div>
      </div>

      <div class="plan-col taskselwrap">
        <label><span class="ico">🛠️</span>Task</label>
        ${taskColHtml}
      </div>
    </div>`;
  }).join('');
}


function busyElsewhere(workerId,jobId){
  const dayPlan=plans[planDate]||{};
  for(const jid in dayPlan){
    if(Number(jid)===jobId) continue;
    if(dayPlan[jid].workerIds.includes(workerId)) return true;
  }
  return false;
}

function toggleMsel(jobId){
  const panel=document.getElementById(`mselpanel-${jobId}`);
  const isOpen=panel.classList.contains('open');
  document.querySelectorAll('.msel-panel').forEach(p=>p.classList.remove('open'));
  if(isOpen){ flushPendingRemote(); renderPlan(); return; }
  openMsel(jobId);
}
function openMsel(jobId){
  const panel=document.getElementById(`mselpanel-${jobId}`);
  const cell=getCell(planDate,jobId);
  panel.innerHTML = workers.length? workers.map(w=>{
    const busy=busyElsewhere(w.id,jobId);
    const sel=cell.workerIds.includes(w.id);
    return `<div class="msel-item ${sel?'selected':''} ${busy?'disabled':''}" onclick="event.stopPropagation();${busy?'':`toggleWorkerSel(${jobId},${w.id})`}">
      <span class="check">${sel?'&#10003;':''}</span><span>${w.name}</span>${busy?'<span class="busytag">busy</span>':''}
    </div>`;
  }).join('') : '<div class="empty-state">No workers</div>';
  panel.classList.add('open');
}
function toggleWorkerSel(jobId,workerId){
  const cell=getCell(planDate,jobId);
  if(cell.workerIds.includes(workerId)) cell.workerIds=cell.workerIds.filter(id=>id!==workerId);
  else cell.workerIds.push(workerId);
  save();
  openMsel(jobId); // keep panel open, refresh checkmarks
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.msel')){
    const anyOpen = document.querySelector('.msel-panel.open');
    document.querySelectorAll('.msel-panel').forEach(p=>p.classList.remove('open'));
    if(anyOpen){ flushPendingRemote(); renderPlan(); }
  }
});

function toggleTsel(jobId){
  const panel=document.getElementById(`tselpanel-${jobId}`);
  const isOpen=panel.classList.contains('open');
  document.querySelectorAll('.msel-panel').forEach(p=>p.classList.remove('open'));
  if(isOpen){ flushPendingRemote(); renderPlan(); return; }
  openTsel(jobId);
}
function openTsel(jobId){
  const panel=document.getElementById(`tselpanel-${jobId}`);
  const cell=getCell(planDate,jobId);
  panel.innerHTML = tasks.map(t=>{
    const sel=cell.tasks.includes(t);
    return `<div class="msel-item ${sel?'selected':''}" onclick="event.stopPropagation();selectTaskItem(${jobId},'${t.replace(/'/g,"\\'")}')">
      <span class="check">${sel?'&#10003;':''}</span><span>${t}</span>
    </div>`;
  }).join('')
  + `<div class="task-add-row" style="margin-top:8px" onclick="event.stopPropagation()">
       <input type="text" id="newTaskInput-${jobId}" placeholder="New task name" onkeydown="if(event.key==='Enter'){event.stopPropagation();confirmNewTask(${jobId})}">
       <button type="button" onclick="event.stopPropagation();confirmNewTask(${jobId})">Add</button>
     </div>`;
  panel.classList.add('open');
}
function selectTaskItem(jobId,taskName){
  const cell=getCell(planDate,jobId);
  if(cell.tasks.includes(taskName)) cell.tasks=cell.tasks.filter(t=>t!==taskName);
  else cell.tasks.push(taskName);
  save();
  openTsel(jobId);
}
function confirmNewTask(jobId){
  const inp=document.getElementById(`newTaskInput-${jobId}`);
  const v=inp.value.trim();
  if(v){
    if(!tasks.includes(v)) tasks.push(v);
    getCell(planDate,jobId).tasks.push(v);
    save();
  }
  openTsel(jobId);
}

async function generatePDF(){
  if(!jobs.length) return;

  const dateObj=new Date(planDate+'T00:00:00');
  const dayStr=dateObj.toLocaleDateString('en-US',{weekday:'long'});
  const dateStr=dateObj.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('pdfBannerDate').textContent = `${dayStr}, ${dateStr}`;

  const bannerEl=document.getElementById('pdfBanner');
  const canvas=await html2canvas(bannerEl,{backgroundColor:'#100e0c',scale:2});
  const imgData=canvas.toDataURL('image/png');

  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'letter'});
  const pageW=doc.internal.pageSize.getWidth();
  const pageH=doc.internal.pageSize.getHeight();
  const margin=28;

  const black=[16,14,12], yellow=[245,181,42], white=[255,255,255], dimYellow=[120,90,20];
  const colX = { addr:margin+6, workers:margin+6+180, task:margin+6+180+190 };
  const colW = { addr:180, workers:190, task: pageW-margin-colX.task-margin };

  function fillPage(){
    doc.setFillColor(...black);
    doc.rect(0,0,pageW,pageH,'F');
  }
  function drawTableHeader(yTop){
    doc.setFillColor(...yellow);
    doc.rect(margin,yTop,pageW-margin*2,20,'F');
    doc.setTextColor(...black);
    doc.setFont('helvetica','bold');
    doc.setFontSize(10);
    doc.text('JOB SITE', colX.addr+2, yTop+14);
    doc.text('CREW', colX.workers+colW.workers/2, yTop+14, {align:'center'});
    doc.text('TASK', colX.task+colW.task/2, yTop+14, {align:'center'});
    return yTop+20;
  }

  fillPage();
  const imgW=pageW-margin*2;
  const imgH=imgW*(canvas.height/canvas.width);
  doc.addImage(imgData,'PNG',margin,margin,imgW,imgH);
  let y=margin+imgH+16;
  y=drawTableHeader(y);

  doc.setFont('helvetica','normal');
  doc.setFontSize(10);

  jobs.forEach((j)=>{
    const cell=getCell(planDate,j.id);
    const workerNames = cell.workerIds.map(id=>{const w=workers.find(x=>x.id===id); return w?w.name:null;}).filter(Boolean).join(', ') || '-';
    const taskNames = cell.tasks.length? cell.tasks.join(', ') : '-';

    doc.setFont('helvetica','bold');
    const addrLines=doc.splitTextToSize(j.name, colW.addr-8);
    doc.setFont('helvetica','normal');
    const workerLines=doc.splitTextToSize(workerNames, colW.workers-12);
    const taskLines=doc.splitTextToSize(taskNames, colW.task-12);
    const maxLines=Math.max(addrLines.length,workerLines.length,taskLines.length,1);
    const rowH=maxLines*13+10;

    if(y+rowH>pageH-margin-20){
      doc.addPage();
      fillPage();
      y=margin;
      y=drawTableHeader(y);
    }

    doc.setTextColor(...white);
    doc.setFont('helvetica','bold');
    doc.text(addrLines, colX.addr+2, y+15);

    doc.setFont('helvetica','normal');
    doc.text(workerLines, colX.workers+colW.workers/2, y+15, {align:'center'});

    doc.setTextColor(...yellow);
    doc.text(taskLines, colX.task+colW.task/2, y+15, {align:'center'});

    y+=rowH;
    doc.setDrawColor(...dimYellow);
    doc.line(margin,y,pageW-margin,y);
  });

  if(y+40<pageH-margin){
    y+=22;
    doc.setTextColor(...yellow);
    doc.setFont('helvetica','bold');
    doc.setFontSize(14);
    doc.text("LET'S BUILD!", pageW/2, y, {align:'center'});
    doc.setTextColor(...white);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.text('SAFETY FIRST \u2022 QUALITY ALWAYS \u2022 THANK YOU FOR YOUR HARD WORK', pageW/2, y+16, {align:'center'});
  }

  doc.save(`schedule-${planDate}.pdf`);
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-dashboard').style.display = t.dataset.tab==='dashboard'?'block':'none';
    document.getElementById('view-schedule').style.display = t.dataset.tab==='schedule'?'block':'none';
  };
});

load();
</script>
</body>
</html>
